<!--
  mariasol — marque de l'application.

  Lecture : le mot se lit « marisol » ; le « i » et le « a » en rouge disent
  l'intelligence artificielle, le « a » étant réduit et remonté pour ne pas
  casser la lecture. Le soleil — SOL — se lève au-dessus de la matrice des
  positions, qui est ce que l'outil produit.

  Couleurs de la charte de l'État : bleu France #000091, rouge Marianne
  #e1000f, blanc. Aucune reprise du bloc-marque officiel ni de la Marianne :
  la forme est propre à l'application.

  Le mot-marque est en tracés vectoriels, pas en texte : le rendu est
  identique sur tout poste, sans dépendre des polices installées.
-->
