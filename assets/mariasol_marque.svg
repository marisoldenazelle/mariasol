<!--
  mariasol — marque de l'application.

  Lecture : le mot se lit « marisol » ; le « i » et le « a » en rouge disent
  l'intelligence artificielle, le « a » étant réduit et remonté pour ne pas
  casser la lecture. Le soleil — SOL — se lève au-dessus de la matrice des
  positions, qui est ce que l'outil produit.

  Couleurs de la charte de l'État : bleu France #000091, rouge Marianne
  #e1000f, blanc. Aucune reprise du bloc-marque officiel ni de la Marianne :
  la forme est propre à l'application.

  Le mot-marque est en tracés vectoriels, pas en texte : le rendu est
  identique sur tout poste, sans dépendre des polices installées.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="mariasol — marque">
  
  <rect x="0.0" y="0.0" width="128.0" height="128.0" rx="27.1" fill="#000091"/>
  <circle cx="64.0" cy="40.6" r="17.2" fill="#ffffff"/>
  <line x1="64.0" y1="17.9" x2="64.0" y2="10.5" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
  <line x1="80.1" y1="24.5" x2="85.3" y2="19.3" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
  <line x1="86.7" y1="40.6" x2="94.1" y2="40.6" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
  <line x1="80.1" y1="56.7" x2="85.3" y2="61.9" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
  <line x1="64.0" y1="63.4" x2="64.0" y2="70.7" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
  <line x1="47.9" y1="56.7" x2="42.7" y2="61.9" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
  <line x1="41.3" y1="40.6" x2="33.9" y2="40.6" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
  <line x1="47.9" y1="24.5" x2="42.7" y2="19.3" stroke="#ffffff" stroke-width="4.4" stroke-linecap="round"/>
  <rect x="27.1" y="73.8" width="19.7" height="13.5" rx="3.1" fill="#ffffff" opacity="0.94"/>
  <rect x="54.2" y="73.8" width="19.7" height="13.5" rx="3.1" fill="#e1000f" opacity="0.94"/>
  <rect x="81.2" y="73.8" width="19.7" height="13.5" rx="3.1" fill="#ffffff" opacity="0.94"/>
  <rect x="27.1" y="93.5" width="19.7" height="13.5" rx="3.1" fill="#ffffff" opacity="0.42"/>
  <rect x="54.2" y="93.5" width="19.7" height="13.5" rx="3.1" fill="#ffffff" opacity="0.94"/>
